<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI App Generator{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Floating per-page edit chatbot -->
    <div id="chatbot-container" class="chatbot-collapsed">
        <button id="chatbot-toggle" onclick="toggleChatbot()" aria-label="Edit this page">
            <img src="/static/images/chat-icon.svg" alt="" class="chatbot-icon">
        </button>
        <div id="chatbot-body">
            <div class="chatbot-head">
                <strong>Edit this page</strong>
                <button type="button" class="ghost" onclick="toggleChatbot()">×</button>
            </div>
            <a href="/" class="utility-name" style="font-size:0.85rem;">← Back to home</a>
            <textarea id="chatInput" placeholder="Describe a change to this page…"></textarea>
            <button id="chat-send" onclick="submitChat()">Send</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
    function toast(message, type = "") {
        const container = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = "toast " + type;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    function toggleChatbot() {
        const c = document.getElementById("chatbot-container");
        c.classList.toggle("chatbot-collapsed");
        c.classList.toggle("chatbot-expanded");
    }

    async function submitChat() {
        const input = document.getElementById("chatInput");
        const prompt = input.value.trim();
        if (!prompt) { toast("Please enter a change to make.", "error"); return; }

        const route = window.location.pathname.replace("_html", "").replace("/", "");
        const btn = document.getElementById("chat-send");
        btn.disabled = true;
        btn.textContent = "Updating…";

        try {
            const res = await fetch("/chatbot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: route, prompt }),
            });
            const data = await res.json();
            if (res.ok) {
                input.value = "";
                toast("Updated! Reloading…", "success");
                setTimeout(() => location.reload(), 1400);
            } else {
                toast("Error: " + (data.error || "update failed."), "error");
                btn.disabled = false;
                btn.textContent = "Send";
            }
        } catch (err) {
            toast("Network error: " + err.message, "error");
            btn.disabled = false;
            btn.textContent = "Send";
        }
    }
    </script>
</body>
</html>
